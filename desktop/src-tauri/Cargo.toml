[package]
name = "whatsrisky-desktop"
version = "0.6.0"
description = "Desktop front end for whatsrisky"
edition = "2021"
rust-version = "1.77"

[lib]
name = "whatsrisky_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
