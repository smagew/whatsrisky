[project]
name = "whatsrisky"
dynamic = ["version"]
description = "What's risky in this project? Semgrep + Trivy + gitleaks + Claude, merged into one prioritized security report (DOCX/MD/JSON)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alisher Gafurov", email = "alisher@vertex.lt" }]
keywords = ["security", "sast", "semgrep", "trivy", "gitleaks", "secrets", "cve", "audit", "report", "claude", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "python-docx>=1.1.2",
    "rich>=13.7",
    "textual>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.2", "jsonschema>=4.0"]

[project.urls]
Homepage = "https://github.com/smagew/whatsrisky"
Repository = "https://github.com/smagew/whatsrisky"
Issues = "https://github.com/smagew/whatsrisky/issues"
Changelog = "https://github.com/smagew/whatsrisky/blob/main/CHANGELOG.md"

[project.scripts]
whatsrisky = "whatsrisky.cli:main"

[tool.hatch.version]
path = "whatsrisky/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whatsrisky"]

[tool.pytest.ini_options]
markers = ["integration: needs a real scanner binary installed"]
