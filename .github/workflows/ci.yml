name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs and the tools to explicit versions: a mutable
# tag or a `latest` download is an unreviewed change in a security tool. Semgrep
# is pinned for a second reason - the self-scan gate below must fail because our
# code changed, not because the registry shipped a new rule overnight.
env:
  SEMGREP_VERSION: "1.174.0"
  TRIVY_VERSION: "0.74.0"
  GITLEAKS_VERSION: "8.30.1"
  # The scan gate uses a fixed ruleset rather than `auto` for the same reason.
  SELF_SCAN_RULES: "p/security-audit"

permissions:
  contents: read

jobs:
  unit:
    name: unit · python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      # Two things this step has to survive. A uv-managed interpreter refuses
      # --system ("externally managed"), so the work happens in a venv and every
      # command goes through `uv run`. And setup-uv has already created that venv
      # when given a python-version, so creating it must tolerate one being there.
      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python }} --allow-existing
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run python -m pyflakes whatsrisky tests
      - name: Unit tests
        run: uv run python -m pytest tests -q -m "not integration"

  integration:
    name: integration · real scanners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Create the environment
        run: |
          uv venv --python 3.12 --allow-existing
          uv pip install -e ".[dev]" "semgrep==${SEMGREP_VERSION}"
      - name: Install trivy ${{ env.TRIVY_VERSION }}
        run: |
          curl -sSLf "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Versions
        run: uv run whatsrisky doctor || true
      - name: Integration tests
        run: uv run python -m pytest tests -q -m integration

  selfscan:
    name: self-scan
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Create the environment
        run: |
          uv venv --python 3.12 --allow-existing
          uv pip install -e ".[dev]" "semgrep==${SEMGREP_VERSION}"
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      # Dogfooding: whatsrisky must stay clean under its own HIGH bar. The report is
      # uploaded either way, so a failure here can be read rather than guessed at.
      - name: Scan ourselves
        run: |
          uv run whatsrisky . --tools semgrep,gitleaks \
            --semgrep-config "${SELF_SCAN_RULES}" \
            --format json,html --no-compare --fail-on high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: self-scan-report
          path: whatsrisky-reports/
